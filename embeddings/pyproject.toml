[project]
name = "slr1-qwen-retrieval"
version = "0.1.0"
description = "Local Qwen retrieval for the included SLR1 reports"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.4",
  "pillow==12.3.0",
  "scikit-learn==1.9.1",
  "sentence-transformers==5.4.0",
  "torch==2.8.0",
  "transformers==4.57.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
