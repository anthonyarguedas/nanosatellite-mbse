<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLR Search</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0b0b;
      --surface: #111111;
      --line: #343434;
      --muted: #969696;
      --text: #efefef;
      --strong: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 32px 0 72px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 0 0 20px;
      background: var(--background);
      border-bottom: 1px solid var(--line);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .brand {
      margin: 0;
      color: var(--strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .corpus-count {
      color: var(--muted);
      font-size: 11px;
    }

    .search-line {
      display: flex;
      gap: 8px;
    }

    #query {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: var(--surface);
      color: var(--strong);
    }

    #query::placeholder {
      color: #707070;
    }

    #query:focus {
      border-color: var(--strong);
    }

    .search-button {
      min-width: 94px;
      border: 1px solid var(--strong);
      border-radius: 0;
      background: var(--strong);
      color: #090909;
      cursor: pointer;
    }

    .search-button:hover,
    .search-button:focus-visible {
      background: var(--background);
      color: var(--strong);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-top: 16px;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend,
    .slider-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mode {
      position: relative;
      cursor: pointer;
    }

    .mode input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode span {
      display: block;
      padding: 5px 9px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .mode input:checked + span {
      border-color: var(--strong);
      background: var(--strong);
      color: #090909;
    }

    .mode input:focus-visible + span {
      outline: 1px solid var(--strong);
      outline-offset: 2px;
    }

    .slider-control {
      min-width: 210px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    output {
      color: var(--text);
      letter-spacing: 0;
      text-transform: none;
    }

    input[type="range"] {
      width: 100%;
      height: 16px;
      margin: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: var(--line);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -5px;
      appearance: none;
      border: 1px solid var(--strong);
      border-radius: 50%;
      background: var(--strong);
    }

    input[type="range"]::-moz-range-track {
      height: 2px;
      background: var(--line);
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 1px solid var(--strong);
      border-radius: 50%;
      background: var(--strong);
    }

    input[type="range"]:focus-visible {
      outline: 1px solid var(--strong);
      outline-offset: 4px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding: 20px 0 10px;
    }

    .results-header h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    #results {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result,
    .empty {
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .result {
      padding: 18px;
    }

    .result-head,
    .result-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
    }

    .result-title {
      margin: 0;
      color: var(--strong);
      font-size: 14px;
      font-weight: 600;
    }

    .rank {
      display: inline-block;
      min-width: 2.4em;
      color: var(--muted);
      font-weight: 400;
    }

    .result-meta {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .chunk-text {
      margin: 18px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .image-link {
      display: block;
      margin: 18px 0;
      border: 1px solid var(--line);
      background: #080808;
    }

    .result-image {
      display: block;
      width: 100%;
      max-height: 640px;
      object-fit: contain;
    }

    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .source-link {
      color: var(--text);
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .source-link:hover,
    .source-link:focus-visible {
      color: var(--strong);
    }

    .chunk-id {
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .empty {
      padding: 28px 18px;
      color: var(--muted);
    }

    .error {
      border-color: #777777;
      color: var(--text);
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 24px, 960px);
        padding-top: 20px;
      }

      .controls,
      .result-head,
      .result-footer {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }

      .slider-control {
        width: 100%;
      }

      #status,
      .chunk-id {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row">
        <p class="brand">SLR / SEARCH</p>
        <span class="corpus-count">local retrieval</span>
      </div>
      <form id="search-form" role="search">
        <div class="search-line">
          <input id="query" name="q" type="search" autocomplete="off" autofocus
                 placeholder="Search the corpus" aria-label="Search query" required>
          <button id="search-button" class="search-button" type="submit">Search</button>
        </div>
        <div class="controls">
          <fieldset>
            <legend>Method</legend>
            <div class="modes">
              <label class="mode"><input type="radio" name="mode" value="hybrid" checked><span>Hybrid</span></label>
              <label class="mode"><input type="radio" name="mode" value="vector"><span>Vector</span></label>
              <label class="mode"><input type="radio" name="mode" value="visual"><span>Visual</span></label>
              <label class="mode"><input type="radio" name="mode" value="bm25"><span>BM25</span></label>
              <label class="mode"><input type="radio" name="mode" value="regex"><span>Regex</span></label>
            </div>
          </fieldset>
          <div class="slider-control">
            <label class="slider-label" for="top-k">Chunks <output id="top-k-value" for="top-k">12</output></label>
            <input id="top-k" name="top_k" type="range" min="1" max="50" value="12">
          </div>
        </div>
      </form>
    </header>

    <section class="results-header" aria-live="polite">
      <h1>Results</h1>
      <p id="status">Enter a query to search the corpus.</p>
    </section>
    <ol id="results" aria-live="polite">
      <li class="empty">Choose a method, enter a query, then press Search.</li>
    </ol>
  </main>

  <script>
    const form = document.querySelector("#search-form");
    const query = document.querySelector("#query");
    const topK = document.querySelector("#top-k");
    const topKValue = document.querySelector("#top-k-value");
    const button = document.querySelector("#search-button");
    const results = document.querySelector("#results");
    const status = document.querySelector("#status");
    let requestNumber = 0;

    function selectedMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function pageRange(result) {
      if (result.page_start === null || result.page_start === undefined) {
        return "page unavailable";
      }
      if (result.page_end && result.page_end !== result.page_start) {
        return `pp. ${result.page_start}-${result.page_end}`;
      }
      return `p. ${result.page_start}`;
    }

    function element(name, className, text) {
      const node = document.createElement(name);
      if (className) {
        node.className = className;
      }
      if (text !== undefined) {
        node.textContent = text;
      }
      return node;
    }

    function externalLink(label, href) {
      const link = element("a", "source-link", label);
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      return link;
    }

    function sourceLinks(result) {
      const links = element("span", "source-links");
      if (result.image_url) {
        links.append(externalLink("Open image", result.image_url));
      }
      if (result.pdf_url) {
        links.append(externalLink("Open PDF", result.pdf_url));
      }
      if (!links.childElementCount) {
        links.append(element("span", "source-link", "Source unavailable"));
      }
      return links;
    }

    function resultItem(result) {
      const item = element("li", "result");
      const head = element("div", "result-head");
      const title = element("h2", "result-title");
      const rank = element("span", "rank", String(result.rank).padStart(2, "0"));
      title.append(rank, document.createTextNode(result.title));
      head.append(title);
      item.append(head);

      const metadata = element(
        "p",
        "result-meta",
        `${result.report_id} · ${pageRange(result)} · ${result.chunk_type}`
      );
      item.append(metadata);

      if (result.display_type === "image" && result.image_url) {
        const imageLink = element("a", "image-link");
        imageLink.href = result.image_url;
        imageLink.target = "_blank";
        imageLink.rel = "noopener";
        const image = element("img", "result-image");
        image.src = result.image_url;
        image.alt = `${result.title}, ${result.section}`;
        image.loading = "lazy";
        imageLink.append(image);
        item.append(imageLink);
      }
      if (result.text) {
        item.append(element("p", "chunk-text", result.text));
      }

      const footer = element("div", "result-footer");
      footer.append(sourceLinks(result));
      footer.append(element("span", "chunk-id", result.chunk_id));
      item.append(footer);
      return item;
    }

    function showMessage(message, error = false) {
      results.replaceChildren(element("li", error ? "empty error" : "empty", message));
    }

    function render(payload) {
      if (!payload.results.length) {
        showMessage("No matching chunks.");
        status.textContent = "0 chunks";
        return;
      }
      results.replaceChildren(...payload.results.map(resultItem));
      const ranking = payload.reranked ? " · reranked" : "";
      status.textContent = `${payload.results.length} ${payload.results.length === 1 ? "result" : "results"} · ${payload.mode}${ranking}`;
    }

    function updateModeHint() {
      query.placeholder = selectedMode() === "regex"
        ? "Regular expression, for example state\\s+machine"
        : "Search the corpus";
    }

    topK.addEventListener("input", () => {
      topKValue.value = topK.value;
      topKValue.textContent = topK.value;
    });

    document.querySelectorAll('input[name="mode"]').forEach((mode) => {
      mode.addEventListener("change", updateModeHint);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = query.value.trim();
      if (!value) {
        query.focus();
        return;
      }

      const currentRequest = ++requestNumber;
      button.disabled = true;
      button.textContent = "Searching";
      status.textContent = "Searching…";
      results.setAttribute("aria-busy", "true");

      try {
        const parameters = new URLSearchParams({
          q: value,
          mode: selectedMode(),
          top_k: topK.value,
        });
        const response = await fetch(`/api/search?${parameters}`);
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || "Search failed.");
        }
        if (currentRequest === requestNumber) {
          render(payload);
        }
      } catch (error) {
        if (currentRequest === requestNumber) {
          const message = error instanceof Error ? error.message : "Search failed.";
          showMessage(message, true);
          status.textContent = "Search failed";
        }
      } finally {
        if (currentRequest === requestNumber) {
          button.disabled = false;
          button.textContent = "Search";
          results.removeAttribute("aria-busy");
        }
      }
    });
  </script>
</body>
</html>
