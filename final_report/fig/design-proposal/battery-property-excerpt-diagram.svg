<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="186pt" height="118pt" viewBox="0 0 186 118" role="img" aria-label="Battery property declarations">
  <title>Battery property declarations</title>
  <rect x="0" y="0" width="186" height="118" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <g data-card="Battery">
    <rect x="0" y="0" width="186" height="118" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="10" y="21" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Battery</text>
    <path d="M0 31 H186" stroke="#111111" stroke-width=".6" />
    <text x="10" y="50" font-family="Times New Roman, Times, serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#111111">series_count [cell]</text>
    <text x="10" y="66" font-family="Times New Roman, Times, serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#111111">parallel_count [string]</text>
    <text x="10" y="82" font-family="Times New Roman, Times, serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#111111">cell_count [cell] *</text>
    <text x="10" y="98" font-family="Times New Roman, Times, serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#111111">cell_rated_energy [Wh]</text>
    <text x="10" y="114" font-family="Times New Roman, Times, serif" font-size="10.7" font-weight="normal" text-anchor="start" fill="#111111">rated_energy [Wh] *</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none" />
</svg>