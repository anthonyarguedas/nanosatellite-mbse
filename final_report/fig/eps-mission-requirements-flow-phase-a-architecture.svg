<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1264pt" viewBox="0 0 1000 1264" role="img" aria-label="Phase A: EPS architecture and requirement allocation">
  <title>Phase A: EPS architecture and requirement allocation</title>
  <rect x="0" y="0" width="1000" height="1264" fill="white" stroke="none" stroke-width=".8" />
