    <text x="700" y="284" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="right">Subsystem functions,</text>
    <text x="700" y="308" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="right">modes and duty cycles</text>
  </g>
