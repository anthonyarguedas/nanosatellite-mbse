    <text x="530" y="1158" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="output">Accepted concept / ConOps, power estimates,</text>
    <text x="530" y="1182" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="output">budgets, risks and initial V&amp;V approach</text>
  </g>
  <g data-flow="findings" data-source="review" data-target="n0" data-kind="findings" data-exchange-label="No: review findings / conditions">
    <path d="M410 1080 H14 V232 H340" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="flow-findings" />
    <text x="30" y="1066" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="findings">No: review findings / conditions</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M500 199 V200" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-input" />
    <path d="M180 379 V380" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-left" />
    <path d="M820 379 V380" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-right" />
    <path d="M180 559 V560" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-left-down" />
    <path d="M820 559 V560" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-right-down" />
    <path d="M390 739 V740" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-left-join" />
    <path d="M610 739 V740" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-right-join" />
    <path d="M500 899 V900" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-plans" />
    <path d="M500 1024 V1025" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-review" />
    <path d="M500 1191 V1192" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-output" />
    <path d="M339 232 H340" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-findings" />
