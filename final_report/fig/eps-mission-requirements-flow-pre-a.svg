    <text x="200" y="476" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left-down">Eclipse / sunlight periods,</text>
    <text x="200" y="500" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left-down">array incidence and</text>
    <text x="200" y="524" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left-down">temperature bounds</text>
  </g>
  <g data-flow="right-down" data-source="n2" data-target="n4" data-kind="information" data-exchange-label="Nominal / peak powers, / duty cycles and / operating assumptions">
    <path d="M820 444 V560" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-right-down" />
    <text x="800" y="476" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="right-down">Nominal / peak powers,</text>
    <text x="800" y="500" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="right-down">duty cycles and</text>
    <text x="800" y="524" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="right-down">operating assumptions</text>
  </g>
  <g data-flow="left-join" data-source="n3" data-target="n5" data-kind="information" data-exchange-label="Generation / storage bounds, / conversion efficiencies">
    <path d="M180 624 V705 H390 V740" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-left-join" />
    <text x="200" y="668" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left-join">Generation / storage bounds,</text>
    <text x="200" y="692" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left-join">conversion efficiencies</text>
  </g>
  <g data-flow="right-join" data-source="n4" data-target="n5" data-kind="information" data-exchange-label="Mode demand profiles, / nominal / peak energy estimates">
    <path d="M900 624 V705 H610 V740" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-right-join" />
    <text x="880" y="668" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="right-join">Mode demand profiles,</text>
    <text x="880" y="692" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="right-join">nominal / peak energy estimates</text>
  </g>
  <g data-flow="plans" data-source="n5" data-target="n6" data-kind="information" data-exchange-label="Concept budgets, assumptions, / uncertainty and feasibility risks">
    <path d="M500 804 V900" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-plans" />
    <text x="520" y="838" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="plans">Concept budgets, assumptions,</text>
    <text x="520" y="862" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="plans">uncertainty and feasibility risks</text>
  </g>
  <g data-flow="review" data-source="n6" data-target="review" data-kind="information" data-exchange-label="Concept, budgets, assumptions and risks, / preliminary verification / validation approach">
    <path d="M500 964 V1025" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-review" />
    <text x="530" y="988" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="review">Concept, budgets, assumptions and risks,</text>
    <text x="530" y="1012" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="review">preliminary verification / validation approach</text>
  </g>
  <g data-flow="output" data-source="review" data-target="output" data-kind="accepted-information" data-exchange-label="Accepted concept / ConOps, power estimates, / budgets, risks and initial V&amp;V approach" data-requires-acceptance="true">
