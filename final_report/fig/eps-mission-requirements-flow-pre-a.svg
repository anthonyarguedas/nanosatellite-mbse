<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1264pt" viewBox="0 0 1000 1264" role="img" aria-label="Pre-Phase A: mission concept and EPS feasibility">
  <title>Pre-Phase A: mission concept and EPS feasibility</title>
  <rect x="0" y="0" width="1000" height="1264" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Pre-Phase A, MR-01, ending at MCR. Short activity boxes exchange the information written beside each arrow. Review findings return to the initial activity. Cross-phase changes use change control.</desc>
  <text x="8" y="27" font-family="Times New Roman, Times, serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">Pre-Phase A: mission concept and EPS feasibility</text>
  <g data-node="input" data-kind="incoming-basis" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="340" y="44" width="320" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500.0" y="69.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Mission / spacecraft</text>
    <text x="500.0" y="97.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">context</text>
  </g>
  <g data-node="n0" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="340" y="200" width="320" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500.0" y="225.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Define mission</text>
    <text x="500.0" y="253.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">and ConOps</text>
  </g>
  <g data-node="n1" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="40" y="380" width="280" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="180.0" y="405.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Analyse orbit</text>
    <text x="180.0" y="433.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">and attitude</text>
  </g>
  <g data-node="n2" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="680" y="380" width="280" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="820.0" y="405.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Estimate payload /</text>
    <text x="820.0" y="433.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">subsystem power</text>
  </g>
  <g data-node="n3" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="40" y="560" width="280" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="180.0" y="585.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Bound generation</text>
    <text x="180.0" y="613.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">and storage</text>
  </g>
  <g data-node="n4" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="680" y="560" width="280" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="820.0" y="585.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Construct mode</text>
    <text x="820.0" y="613.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">load profiles</text>
  </g>
  <g data-node="n5" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="340" y="740" width="320" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500.0" y="765.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Assess concept</text>
    <text x="500.0" y="793.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">power / energy</text>
  </g>
  <g data-node="n6" data-kind="activity" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="340" y="900" width="320" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500.0" y="925.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Define initial</text>
    <text x="500.0" y="953.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">V&amp;V approach</text>
  </g>
  <g data-node="output" data-kind="handoff" data-phase="Pre-Phase A" data-mission-requirement="MR-01">
    <rect x="340" y="1192" width="320" height="64" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500.0" y="1217.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">Phase A:</text>
    <text x="500.0" y="1245.68" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">requirements</text>
  </g>
  <g data-node="review" data-kind="review" data-review="MCR" data-mission-requirement="MR-01" data-phase="Pre-Phase A">
    <polygon points="500,1025 590,1080 500,1135 410,1080" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="500" y="1058" font-family="Times New Roman, Times, serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">MR-01</text>
    <text x="500" y="1083" font-family="Times New Roman, Times, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">MCR</text>
    <text x="500" y="1107" font-family="Times New Roman, Times, serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#111111">Accept?</text>
  </g>
  <g data-flow="input" data-source="input" data-target="n0" data-kind="information" data-exchange-label="Expectations, mission constraints, / candidate component / heritage data">
    <path d="M500 108 V200" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-input" />
    <text x="520" y="135" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="input">Expectations, mission constraints,</text>
    <text x="520" y="159" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="input">candidate component / heritage data</text>
  </g>
  <g data-flow="left" data-source="n0" data-target="n1" data-kind="information" data-exchange-label="Orbit / pointing modes, / lifetime and constraints">
    <path d="M420 264 V350 H180 V380" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-left" />
    <text x="50" y="284" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left">Orbit / pointing modes,</text>
    <text x="50" y="308" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="left">lifetime and constraints</text>
  </g>
  <g data-flow="right" data-source="n0" data-target="n2" data-kind="information" data-exchange-label="Subsystem functions, / modes and duty cycles">
