    <text x="820.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">01.6  FR-08</text>
    <text x="820.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Return rejection</text>
    <text x="820.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">findings</text>
  </g>
  <g data-flow="1" data-source="1" data-target="2" data-kind="information" data-exchange-label="Raw submission, identity and provenance; / declared interface specification">
    <path d="M275 160 V280" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-1" />
    <text x="300.0" y="194" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">Raw submission, identity and provenance;</text>
    <text x="300.0" y="219" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">declared interface specification</text>
  </g>
  <g data-flow="2" data-source="2" data-target="3" data-kind="information" data-exchange-label="[compatible] Revisions, structure, quantities, / units, polarity and time / mode meanings">
    <path d="M275 370 V490" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-2" />
    <text x="300.0" y="404" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">[compatible] Revisions, structure, quantities,</text>
    <text x="300.0" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">units, polarity and time / mode meanings</text>
  </g>
  <g data-flow="3" data-source="3" data-target="4" data-kind="information" data-exchange-label="Admitted records with identifiers, / revisions, producer and provenance">
    <path d="M275 580 V700" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-3" />
    <text x="300.0" y="614" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">Admitted records with identifiers,</text>
    <text x="300.0" y="639" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">revisions, producer and provenance</text>
  </g>
  <g data-flow="4" data-source="2" data-target="5" data-kind="findings" data-exchange-label="[incompatible] / raw + findings">
    <path d="M480 350 H670" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="flow-4" />
    <text x="500" y="302" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">[incompatible]</text>
    <text x="500" y="327" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">raw + findings</text>
  </g>
  <g data-flow="5" data-source="5" data-target="6" data-kind="findings" data-exchange-label="Unchanged controlled content; / rejected values and incompatibilities">
    <path d="M820 370 V490" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="flow-5" />
    <text x="795" y="453" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="5">Unchanged controlled content;</text>
    <text x="795" y="478" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="5">rejected values and incompatibilities</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M275 279 V280" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-1" />
    <path d="M275 489 V490" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-2" />
    <path d="M275 699 V700" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-3" />
    <path d="M669 350 H670" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-4" />
    <path d="M820 489 V490" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-5" />
  </g>
