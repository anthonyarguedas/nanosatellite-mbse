<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="815pt" viewBox="0 0 1000 815" role="img" aria-label="01  Controlled transfer admission">
  <title>01  Controlled transfer admission</title>
  <rect x="0" y="0" width="1000" height="815" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Proposed decomposition of existing functional requirements. Gray identifies external participants. Framework activities exchange the labeled information. Human decisions retain their specified authority.</desc>
  <text x="20" y="30" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111111">01  Controlled transfer admission</text>
  <g data-node="1" data-kind="external" data-owner="Engineer / source" data-frs="" data-activity-id="01.1">
    <rect x="70" y="70" width="410" height="90" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="93" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">Engineer / source</text>
    <text x="275.0" y="123" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Submit engineering</text>
    <text x="275.0" y="150" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">information</text>
  </g>
  <g data-node="2" data-kind="activity" data-owner="Framework" data-frs="FR-08" data-activity-id="01.2">
    <rect x="70" y="280" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="303" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">01.2  FR-08</text>
    <text x="275.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Check transferred</text>
    <text x="275.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">meanings</text>
  </g>
  <g data-node="3" data-kind="activity" data-owner="Framework" data-frs="FR-08" data-activity-id="01.3">
    <rect x="70" y="490" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">01.3  FR-08</text>
    <text x="275.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Register compatible</text>
    <text x="275.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">information</text>
  </g>
  <g data-node="4" data-kind="record" data-owner="Framework" data-frs="FR-08" data-activity-id="01.4">
    <rect x="70" y="700" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="723" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">01.4  FR-08</text>
    <text x="275.0" y="753" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Retain controlled</text>
    <text x="275.0" y="780" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">records</text>
  </g>
