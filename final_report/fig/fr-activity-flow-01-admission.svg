    <text x="820.0" y="303" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">01.5  FR-08</text>
    <text x="820.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Retain rejected</text>
    <text x="820.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">raw submission</text>
  </g>
  <g data-node="6" data-kind="activity" data-owner="Framework" data-frs="FR-08" data-activity-id="01.6">
