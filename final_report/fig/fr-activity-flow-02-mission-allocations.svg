<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1025pt" viewBox="0 0 1000 1025" role="img" aria-label="02  Mission context and proposed allocations">
  <title>02  Mission context and proposed allocations</title>
  <rect x="0" y="0" width="1000" height="1025" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Proposed decomposition of existing functional requirements. Gray identifies external participants. Framework activities exchange the labeled information. Human decisions retain their specified authority.</desc>
  <text x="20" y="30" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111111">02  Mission context and proposed allocations</text>
  <g data-node="1" data-kind="external" data-owner="Engineer" data-frs="" data-activity-id="02.1">
    <rect x="70" y="70" width="410" height="90" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="93" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">Engineer</text>
    <text x="275.0" y="123" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Supply mission</text>
    <text x="275.0" y="150" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and spacecraft inputs</text>
  </g>
  <g data-node="2" data-kind="activity" data-owner="Framework" data-frs="FR-25" data-activity-id="02.2">
    <rect x="70" y="280" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="303" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">02.2  FR-25</text>
    <text x="275.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Retain mission</text>
    <text x="275.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and ConOps</text>
  </g>
  <g data-node="3" data-kind="activity" data-owner="Framework" data-frs="FR-17" data-activity-id="02.3">
    <rect x="70" y="490" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">02.3  FR-17</text>
    <text x="275.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Derive proposed</text>
    <text x="275.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">EPS allocations</text>
  </g>
  <g data-node="4" data-kind="external" data-owner="Engineer" data-frs="" data-activity-id="02.4">
    <rect x="670" y="490" width="300" height="90" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="820.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">Engineer</text>
    <text x="820.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Disposition</text>
    <text x="820.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">allocations</text>
  </g>
  <g data-node="5" data-kind="activity" data-owner="Framework" data-frs="FR-17" data-activity-id="02.5">
    <rect x="70" y="700" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="723" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">02.5  FR-17</text>
    <text x="275.0" y="753" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Retain allocation</text>
    <text x="275.0" y="780" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">basis and disposition</text>
  </g>
  <g data-node="6" data-kind="activity" data-owner="Framework" data-frs="FR-25 FR-17" data-activity-id="02.6">
    <rect x="70" y="910" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="933" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">02.6  FR-25, FR-17</text>
    <text x="275.0" y="963" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Link requirements</text>
    <text x="275.0" y="990" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and analysis inputs</text>
  </g>
  <g data-flow="1" data-source="1" data-target="2" data-kind="information" data-exchange-label="Expectations, constraints, nominal / degraded / scenarios, spacecraft requirements and sources">
    <path d="M275 160 V280" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-1" />
    <text x="300.0" y="194" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">Expectations, constraints, nominal / degraded</text>
    <text x="300.0" y="219" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">scenarios, spacecraft requirements and sources</text>
  </g>
  <g data-flow="2" data-source="2" data-target="3" data-kind="information" data-exchange-label="Identified mission / scenarios and configuration; / sourced quantities and declared derivation method">
    <path d="M275 370 V490" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-2" />
    <text x="300.0" y="404" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">Identified mission / scenarios and configuration;</text>
    <text x="300.0" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">sourced quantities and declared derivation method</text>
  </g>
  <g data-flow="3" data-source="3" data-target="4" data-kind="information" data-exchange-label="Proposed / allocations">
    <path d="M480 560 H670" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-3" />
    <text x="500" y="512" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">Proposed</text>
    <text x="500" y="537" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">allocations</text>
  </g>
  <g data-flow="4" data-source="4" data-target="5" data-kind="information" data-exchange-label="Engineer disposition of proposed allocations; / parent links, units, assumptions and uncertainty">
    <path d="M820 580 V670 H275 V700" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-4" />
    <text x="795.0" y="614" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="4">Engineer disposition of proposed allocations;</text>
    <text x="795.0" y="639" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="end" fill="#111111" data-exchange-text="4">parent links, units, assumptions and uncertainty</text>
  </g>
  <g data-flow="5" data-source="5" data-target="6" data-kind="information" data-exchange-label="Revision-linked mission conditions, / EPS / component proposals and dispositions">
    <path d="M275 790 V910" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-5" />
    <text x="300.0" y="824" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">Revision-linked mission conditions,</text>
    <text x="300.0" y="849" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">EPS / component proposals and dispositions</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M275 279 V280" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-1" />
    <path d="M275 489 V490" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-2" />
    <path d="M669 560 H670" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-3" />
    <path d="M275 699 V700" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-4" />
    <path d="M275 909 V910" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="flow-5" />
  </g>
