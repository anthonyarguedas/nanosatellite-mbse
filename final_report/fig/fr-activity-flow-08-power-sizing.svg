    <text x="300.0" y="194" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">Nominal / peak mode power, conversion / distribution</text>
    <text x="300.0" y="219" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">losses, efficiencies, duty cycles and schedules</text>
  </g>
