    <text x="300.0" y="614" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">Beginning / end of life array area and</text>
    <text x="300.0" y="639" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">battery capacity, required voltages and cell data</text>
  </g>
  <g data-flow="4" data-source="4" data-target="5" data-kind="information" data-exchange-label="Integer cell counts, array / battery / series and parallel arrangements">
    <path d="M275 790 V910" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-4" />
    <text x="300.0" y="824" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">Integer cell counts, array / battery</text>
    <text x="300.0" y="849" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">series and parallel arrangements</text>
  </g>
  <g data-flow="5" data-source="5" data-target="6" data-kind="information" data-exchange-label="Allocation margins and operating-limit findings; / sizing basis and configured EPS revision">
    <path d="M275 1000 V1120" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-5" />
    <text x="300.0" y="1034" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">Allocation margins and operating-limit findings;</text>
    <text x="300.0" y="1059" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">sizing basis and configured EPS revision</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
