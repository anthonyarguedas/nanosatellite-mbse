    <text x="300.0" y="404" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">Sunlight / eclipse budgets, illumination, temperature,</text>
    <text x="300.0" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="2">degradation, cycle life, discharge limits and margins</text>
  </g>
