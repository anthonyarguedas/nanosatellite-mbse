    <rect x="70" y="700" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="723" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">08.4  FR-20</text>
    <text x="275.0" y="753" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Resolve discrete</text>
