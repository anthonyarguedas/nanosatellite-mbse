    <text x="275.0" y="303" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">11.2  FR-31</text>
    <text x="275.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Check time bases</text>
    <text x="275.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and synchronization</text>
  </g>
  <g data-node="3" data-kind="activity" data-owner="Framework" data-frs="FR-32" data-activity-id="11.3">
    <rect x="70" y="490" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">11.3  FR-32</text>
    <text x="275.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Check channel</text>
    <text x="275.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and sample validity</text>
  </g>
  <g data-node="4" data-kind="activity" data-owner="Framework" data-frs="FR-32" data-activity-id="11.4">
    <rect x="70" y="700" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="723" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">11.4  FR-32</text>
    <text x="275.0" y="753" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Apply processing</text>
    <text x="275.0" y="780" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">masks</text>
