<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1025pt" viewBox="0 0 1000 1025" role="img" aria-label="11  History timing, quality and numerical admission">
  <title>11  History timing, quality and numerical admission</title>
  <rect x="0" y="0" width="1000" height="1025" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Proposed decomposition of existing functional requirements. Gray identifies external participants. Framework activities exchange the labeled information. Human decisions retain their specified authority.</desc>
  <text x="20" y="30" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111111">11  History timing, quality and numerical admission</text>
  <g data-node="1" data-kind="activity" data-owner="Framework" data-frs="FR-32" data-activity-id="11.1">
    <rect x="70" y="70" width="410" height="90" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="275.0" y="93" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">11.1  FR-32</text>
    <text x="275.0" y="123" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Preserve supplied</text>
    <text x="275.0" y="150" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and simulated histories</text>
  </g>
  <g data-node="2" data-kind="activity" data-owner="Framework" data-frs="FR-31" data-activity-id="11.2">
