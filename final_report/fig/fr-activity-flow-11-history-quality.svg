    <text x="275.0" y="933" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">11.5  FR-31, FR-32</text>
    <text x="275.0" y="963" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Supply checked</text>
