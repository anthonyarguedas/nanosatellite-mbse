    <path d="M275 580 V700" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-4" />
    <text x="300.0" y="614" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">Identity, units, timing, completeness and validity;</text>
    <text x="300.0" y="639" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">raw values, invalid samples and missing intervals</text>
  </g>
  <g data-flow="5" data-source="3" data-target="7" data-kind="findings" data-exchange-label="Invalid / missing / status + masks">
    <path d="M480 560 H670" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="flow-5" />
