<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1025pt" viewBox="0 0 1000 1025" role="img" aria-label="16  Interface definitions and modeled control behavior">
  <title>16  Interface definitions and modeled control behavior</title>
  <rect x="0" y="0" width="1000" height="1025" fill="white" stroke="none" stroke-width=".8" />
  <defs>
