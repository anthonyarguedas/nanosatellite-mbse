    <text x="300.0" y="614" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">Overcurrent / undervoltage / overvoltage, interruption,</text>
    <text x="300.0" y="639" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="3">hysteresis, load shedding and recovery responses</text>
  </g>
  <g data-flow="4" data-source="4" data-target="5" data-kind="information" data-exchange-label="Simulated / supplied histories, fault hypotheses, / diagnostic alternatives and assessment evidence">
    <path d="M275 790 V910" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-4" />
    <text x="300.0" y="824" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">Simulated / supplied histories, fault hypotheses,</text>
    <text x="300.0" y="849" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="4">diagnostic alternatives and assessment evidence</text>
  </g>
  <g data-flow="5" data-source="5" data-target="6" data-kind="information" data-exchange-label="Stimuli, expected / actual responses, criterion findings, / alternative hypotheses, execution limits and failures">
    <path d="M275 1000 V1120" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="flow-5" />
    <text x="300.0" y="1034" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">Stimuli, expected / actual responses, criterion findings,</text>
    <text x="300.0" y="1059" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="5">alternative hypotheses, execution limits and failures</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
