    <text x="275.0" y="513" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">18.3  FR-19</text>
    <text x="275.0" y="543" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Execute fault</text>
    <text x="275.0" y="570" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and recovery scenarios</text>
