    <text x="300.0" y="194" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">Identified plant / controller models, fixed stimuli,</text>
    <text x="300.0" y="219" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="start" fill="#111111" data-exchange-text="1">expected responses, declared criteria and checked histories</text>
  </g>
  <g data-flow="2" data-source="2" data-target="3" data-kind="information" data-exchange-label="Nominal / step responses, DET / MPPT / end-of-charge / transitions and command / mode changes">
