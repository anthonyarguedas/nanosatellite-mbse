    <text x="275.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Execute nominal</text>
    <text x="275.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and transition scenarios</text>
  </g>
  <g data-node="3" data-kind="activity" data-owner="Framework" data-frs="FR-19" data-activity-id="18.3">
