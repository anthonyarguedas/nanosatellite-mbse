    <text x="275.0" y="93" font-family="Times New Roman, Times, serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#111111" data-trace-header="true">18.1  FR-19</text>
    <text x="275.0" y="123" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Fix MIL scenarios</text>
    <text x="275.0" y="150" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">and assessment criteria</text>
  </g>
