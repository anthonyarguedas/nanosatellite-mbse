<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1235pt" viewBox="0 0 1000 1235" role="img" aria-label="18  MIL execution and fault diagnosis assessment">
  <title>18  MIL execution and fault diagnosis assessment</title>
  <rect x="0" y="0" width="1000" height="1235" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Proposed decomposition of existing functional requirements. Gray identifies external participants. Framework activities exchange the labeled information. Human decisions retain their specified authority.</desc>
  <text x="20" y="30" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111111">18  MIL execution and fault diagnosis assessment</text>
