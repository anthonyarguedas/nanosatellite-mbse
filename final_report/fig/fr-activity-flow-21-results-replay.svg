    <text x="275.0" y="333" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">Retain raw outputs,</text>
    <text x="275.0" y="360" font-family="Times New Roman, Times, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111" data-activity-label="true">logs and run status</text>
  </g>
  <g data-node="3" data-kind="activity" data-owner="Framework" data-frs="FR-10" data-activity-id="21.3">
