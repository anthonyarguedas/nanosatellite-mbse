<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000pt" height="1235pt" viewBox="0 0 1000 1235" role="img" aria-label="21  Result provenance, reconstruction and replay">
  <title>21  Result provenance, reconstruction and replay</title>
  <rect x="0" y="0" width="1000" height="1235" fill="white" stroke="none" stroke-width=".8" />
  <defs>
