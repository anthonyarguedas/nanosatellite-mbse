<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="470pt" viewBox="0 0 690 470" role="img" aria-label="Framework boundary and external exchanges">
  <title>Framework boundary and external exchanges</title>
  <rect x="0" y="0" width="690" height="470" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>The EPS engineering framework is an opaque black box. Four labeled port rectangles straddle its boundary. Engineers, knowledge sources, simulation tools and reviewers remain outside. Each directed exchange has one head at its destination. IF-01: Engineering use. IF-02: Knowledge and supplied data. IF-03: Simulation coupling. IF-06: Technical review.</desc>
  <text x="8" y="20" font-family="Times New Roman, Times, serif" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">Framework boundary and external exchanges</text>
  <g data-system="Framework">
    <rect x="300" y="49" width="105" height="414" fill="white" stroke="#111111" stroke-width=".8" data-enclosure="Framework" />
    <text x="352.5" y="65" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">EPS</text>
    <text x="352.5" y="83" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">engineering</text>
    <text x="352.5" y="101" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">framework</text>
    <rect x="291.0" y="112" width="18" height="116" fill="white" stroke="#111111" stroke-width=".8" data-port="p01" data-interface="IF-01" data-owner="Framework" data-boundary-x="300" data-features="engineeringSubmission,engineeringResponse" />
    <text x="300" y="174.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 300 170)" data-port-label="p01" data-interface-label="IF-01" data-label-y="170.0" data-label-span="32.662109375">IF-01</text>
    <rect x="396.0" y="112" width="18" height="116" fill="white" stroke="#111111" stroke-width=".8" data-port="p02" data-interface="IF-02" data-owner="Framework" data-boundary-x="405" data-features="sourceSubmission,sourceQuery" />
    <text x="405" y="174.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 405 170)" data-port-label="p02" data-interface-label="IF-02" data-label-y="170.0" data-label-span="32.662109375">IF-02</text>
    <rect x="291.0" y="332" width="18" height="116" fill="white" stroke="#111111" stroke-width=".8" data-port="p03" data-interface="IF-03" data-owner="Framework" data-boundary-x="300" data-features="simulationInputs,analysisResults" />
    <text x="300" y="394.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 300 390)" data-port-label="p03" data-interface-label="IF-03" data-label-y="390.0" data-label-span="32.662109375">IF-03</text>
    <rect x="396.0" y="332" width="18" height="116" fill="white" stroke="#111111" stroke-width=".8" data-port="p06" data-interface="IF-06" data-owner="Framework" data-boundary-x="405" data-features="reviewSubmission,reviewResponse" />
    <text x="405" y="394.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 405 390)" data-port-label="p06" data-interface-label="IF-06" data-label-y="390.0" data-label-span="32.662109375">IF-06</text>
  </g>
  <g data-actor="engineers">
    <rect x="8" y="100" width="105" height="130" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="60.5" y="162.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Engineers and</text>
    <text x="60.5" y="178.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">stakeholders</text>
  </g>
  <g data-exchange-interface="IF-01" data-direction="in" data-flow-ids="X01.1">
    <path d="M113 120 H309" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-1" />
    <text x="126" y="77" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Expectations and mission</text>
    <text x="126" y="93" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Requirement drafts</text>
    <text x="126" y="109" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Parameters and changes</text>
  </g>
  <g data-exchange-interface="IF-01" data-direction="out" data-flow-ids="X01.2">
    <path d="M309 220 H113" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-2" />
    <text x="126" y="178" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Requirement checks</text>
    <text x="126" y="194" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Computed parameters</text>
    <text x="126" y="210" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Updated requirements</text>
  </g>
  <g data-actor="sources">
    <rect x="575" y="100" width="107" height="130" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="628.5" y="162.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Knowledge and</text>
    <text x="628.5" y="178.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">data sources</text>
  </g>
  <g data-exchange-interface="IF-02" data-direction="in" data-flow-ids="X02.1">
    <path d="M575 120 H396" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-3" />
    <text x="426" y="77" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Component descriptions</text>
    <text x="426" y="93" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Parameters and models</text>
    <text x="426" y="109" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Reference data</text>
  </g>
  <g data-exchange-interface="IF-02" data-direction="out" data-flow-ids="X02.2">
    <path d="M396 220 H575" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-4" />
    <text x="426" y="210" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Source queries</text>
  </g>
  <g data-actor="tools">
    <rect x="8" y="320" width="105" height="130" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="60.5" y="382.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Simulation</text>
    <text x="60.5" y="398.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">tools</text>
  </g>
  <g data-exchange-interface="IF-03" data-direction="in" data-flow-ids="X03.4">
    <path d="M113 440 H309" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-5" />
    <text x="126" y="414" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Numerical analysis</text>
    <text x="126" y="430" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">results</text>
  </g>
  <g data-exchange-interface="IF-03" data-direction="out" data-flow-ids="X03.1">
    <path d="M309 340 H113" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-6" />
    <text x="126" y="314" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Spacecraft models</text>
    <text x="126" y="330" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Parameters and states</text>
  </g>
  <g data-actor="reviewers">
    <rect x="575" y="320" width="107" height="130" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="628.5" y="390.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Reviewers</text>
  </g>
  <g data-exchange-interface="IF-06" data-direction="in" data-flow-ids="X06.1">
    <path d="M575 440 H396" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-7" />
    <text x="426" y="430" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Review findings</text>
  </g>
  <g data-exchange-interface="IF-06" data-direction="out" data-flow-ids="X06.2">
    <path d="M396 340 H575" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-8" />
    <text x="426" y="330" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Baseline review package</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M308 120 H309" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-1" />
    <path d="M114 220 H113" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-2" />
    <path d="M397 120 H396" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-3" />
    <path d="M574 220 H575" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-4" />
    <path d="M308 440 H309" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-5" />
    <path d="M114 340 H113" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-6" />
    <path d="M397 440 H396" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-7" />
    <path d="M574 340 H575" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-8" />
  </g>
</svg>