<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-labelledby="title description">
  <title id="title">EPS engineering framework: system context</title>
  <desc id="description">Illustrative black-box system context with five interfaces. Engineers, sources and reviewers exchange information with the framework. NVIDIA Omniverse whole CUBICS simulation and model tools supply spacecraft scenario histories and raw numerical results and receive controlled model/run requests and EPS responses for the same scenario. The F Prime host toolchain receives authorized detailed design and coding/build/SIL requests and returns host products, logs and SIL results.</desc>
