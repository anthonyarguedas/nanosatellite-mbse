<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="606pt" viewBox="0 0 690 606" role="img" aria-label="Framework boundary and external exchanges">
  <title>Framework boundary and external exchanges</title>
  <rect x="0" y="0" width="690" height="606" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>The EPS engineering framework is an opaque black box. Five labeled port rectangles straddle its boundary. Engineers, knowledge sources, reviewers, NVIDIA Omniverse and model tools, and the F Prime host toolchain remain outside. Each directed exchange has one head at its destination. IF-01: Engineering use. IF-03: Model analysis. IF-02: Knowledge and supplied data. IF-04: Host software execution. IF-06: Technical review.</desc>
  <text x="8" y="20" font-family="Times New Roman, Times, serif" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">Framework boundary and external exchanges</text>
  <g data-system="Framework">
    <rect x="300" y="49" width="105" height="550" fill="white" stroke="#111111" stroke-width=".8" data-enclosure="Framework" />
    <text x="352.5" y="65" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">EPS</text>
    <text x="352.5" y="83" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">engineering</text>
    <text x="352.5" y="101" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">framework</text>
    <rect x="291.0" y="100" width="18" height="66" fill="white" stroke="#111111" stroke-width=".8" data-port="p01" data-interface="IF-01" data-owner="Framework" data-boundary-x="300" data-features="engineeringSubmission,engineeringResponse" />
    <text x="300" y="137.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 300 133)" data-port-label="p01" data-interface-label="IF-01" data-label-y="133.0" data-label-span="32.662109375">IF-01</text>
    <rect x="396.0" y="204" width="18" height="74" fill="white" stroke="#111111" stroke-width=".8" data-port="p03" data-interface="IF-03" data-owner="Framework" data-boundary-x="405" data-features="analysisRequest,analysisPlan,analysisResponse,analysisResult,spacecraftInputs,epsResponses" />
    <text x="405" y="245.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 405 241)" data-port-label="p03" data-interface-label="IF-03" data-label-y="241.0" data-label-span="32.662109375">IF-03</text>
    <rect x="291.0" y="308" width="18" height="66" fill="white" stroke="#111111" stroke-width=".8" data-port="p02" data-interface="IF-02" data-owner="Framework" data-boundary-x="300" data-features="sourceSubmission,sourceQuery" />
    <text x="300" y="345.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 300 341)" data-port-label="p02" data-interface-label="IF-02" data-label-y="341.0" data-label-span="32.662109375">IF-02</text>
    <rect x="396.0" y="412" width="18" height="70" fill="white" stroke="#111111" stroke-width=".8" data-port="p04" data-interface="IF-04" data-owner="Framework" data-boundary-x="405" data-features="codingResponse,codingRequest,interfaceSpecification,softwareProduct,softwareResult" />
    <text x="405" y="451.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 405 447)" data-port-label="p04" data-interface-label="IF-04" data-label-y="447.0" data-label-span="32.662109375">IF-04</text>
    <rect x="291.0" y="516" width="18" height="70" fill="white" stroke="#111111" stroke-width=".8" data-port="p06" data-interface="IF-06" data-owner="Framework" data-boundary-x="300" data-features="reviewSubmission,reviewResponse" />
    <text x="300" y="555.9" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 300 551)" data-port-label="p06" data-interface-label="IF-06" data-label-y="551.0" data-label-span="32.662109375">IF-06</text>
  </g>
  <g data-actor="engineers">
    <rect x="8" y="84" width="105" height="86" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="60.5" y="124.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Engineers and</text>
    <text x="60.5" y="140.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">stakeholders</text>
  </g>
  <g data-exchange-interface="IF-01" data-direction="in" data-flow-ids="X01.1">
    <path d="M113 108 H309" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-1" />
    <text x="132" y="79" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Engineering submissions</text>
    <text x="132" y="95" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Authorized decisions</text>
  </g>
  <g data-exchange-interface="IF-01" data-direction="out" data-flow-ids="X01.2">
    <path d="M309 158 H113" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-2" />
    <text x="132" y="149" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Guidance and products</text>
  </g>
  <g data-actor="tools">
    <rect x="575" y="188" width="107" height="86" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="628.5" y="204.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">NVIDIA</text>
    <text x="628.5" y="220.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Omniverse</text>
    <text x="628.5" y="236.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">whole-CUBICS</text>
    <text x="628.5" y="252.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">simulation and</text>
    <text x="628.5" y="268.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">model tools</text>
  </g>
  <g data-exchange-interface="IF-03" data-direction="in" data-flow-ids="X03.3,X03.4,X03.5">
    <path d="M575 270 H396" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-3" />
    <text x="430" y="228" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Spacecraft/subsystem</text>
    <text x="430" y="244" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">histories</text>
    <text x="430" y="260" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Raw results and status</text>
  </g>
  <g data-exchange-interface="IF-03" data-direction="out" data-flow-ids="X03.1,X03.2,X03.6">
    <path d="M396 212 H575" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-4" />
    <text x="430" y="164" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Controlled models and</text>
    <text x="430" y="180" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">run requests/plans</text>
    <text x="430" y="196" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">EPS states and results</text>
  </g>
  <g data-actor="sources">
    <rect x="8" y="292" width="105" height="86" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="60.5" y="332.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Knowledge and</text>
    <text x="60.5" y="348.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">data sources</text>
  </g>
  <g data-exchange-interface="IF-02" data-direction="in" data-flow-ids="X02.1">
    <path d="M113 316 H309" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-5" />
    <text x="132" y="270" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Sources and methods</text>
    <text x="132" y="286" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Component properties</text>
    <text x="132" y="302" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Reference data</text>
  </g>
  <g data-exchange-interface="IF-02" data-direction="out" data-flow-ids="X02.2">
    <path d="M309 366 H113" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-6" />
    <text x="132" y="356" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Source queries</text>
  </g>
  <g data-actor="software">
    <rect x="575" y="396" width="107" height="86" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="628.5" y="436.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">F Prime</text>
    <text x="628.5" y="452.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">host toolchain</text>
  </g>
  <g data-exchange-interface="IF-04" data-direction="in" data-flow-ids="X04.1,X04.4,X04.5">
    <path d="M575 474 H396" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-7" />
    <text x="430" y="442" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Host products and logs</text>
    <text x="430" y="458" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">SIL results</text>
  </g>
  <g data-exchange-interface="IF-04" data-direction="out" data-flow-ids="X04.2,X04.3">
    <path d="M396 420 H575" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-8" />
    <text x="430" y="358" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Authorized design</text>
    <text x="430" y="374" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">and interfaces</text>
    <text x="430" y="390" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Coding/build/SIL</text>
    <text x="430" y="406" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">requests</text>
  </g>
  <g data-actor="reviewers">
    <rect x="8" y="500" width="105" height="86" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="60.5" y="532.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Reviewers and</text>
    <text x="60.5" y="548.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">review</text>
    <text x="60.5" y="564.0" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">authority</text>
  </g>
  <g data-exchange-interface="IF-06" data-direction="in" data-flow-ids="X06.1">
    <path d="M113 524 H309" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-line-style="solid" id="arrow-9" />
    <text x="132" y="495" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Findings and authorized</text>
    <text x="132" y="511" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">review decisions</text>
  </g>
  <g data-exchange-interface="IF-06" data-direction="out" data-flow-ids="X06.2">
    <path d="M309 578 H113" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-line-style="dotted" id="arrow-10" />
    <text x="132" y="566" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Review packages</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M308 108 H309" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-1" />
    <path d="M114 158 H113" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-2" />
    <path d="M397 270 H396" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-3" />
    <path d="M574 212 H575" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-4" />
    <path d="M308 316 H309" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-5" />
    <path d="M114 366 H113" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-6" />
    <path d="M397 474 H396" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-7" />
    <path d="M574 420 H575" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-8" />
    <path d="M308 524 H309" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-9" />
    <path d="M114 578 H113" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-10" />
  </g>
</svg>