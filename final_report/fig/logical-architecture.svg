<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="165mm" height="105mm" viewBox="0 0 165 105" role="img" aria-labelledby="title description">
  <title id="title">Logical architecture with selected information and control exchanges</title>
  <desc id="description">Six logical components form an engineering thread inside the framework. Requirements and guidance connects to Mission and EPS design, then Simulation and software integration, Model credibility, Evidence and technical review, and Configuration and controlled exchange. Dashed control paths carry current context to Requirements and guidance and release and revisions to Simulation and software integration. External F Prime receives host requests and returns products and results. External NVIDIA Omniverse supplies whole-CUBICS scenarios and receives EPS states and results. Selected information and control exchanges are shown.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #2e393e; }
      .name { font-size: 3.439583; }
      .id { font-size: 2.998611; font-weight: 700; fill: #396b73; }
      .label { font-size: 2.998611; }
      .heading { font-size: 3.175; font-weight: 700; }
      .external-name { font-size: 3.351389; font-weight: 700; }
      .block { fill: #ffffff; stroke: #46545b; stroke-width: 0.24; }
      .main { fill: none; stroke: #396b73; stroke-width: 0.24; stroke-linejoin: round; marker-end: url(#main-arrow); }
      .control { fill: none; stroke: #6b7b81; stroke-width: 0.21; stroke-dasharray: 1.15 0.8; stroke-linejoin: round; marker-end: url(#control-arrow); }
      .external { fill: none; stroke: #46545b; stroke-width: 0.21; marker-end: url(#external-arrow); }
    </style>
    <marker id="main-arrow" markerUnits="userSpaceOnUse" markerWidth="1.8" markerHeight="1.6" refX="1.8" refY="0.8" viewBox="0 0 1.8 1.6" orient="auto">
      <path d="M 0,0 L 1.8,0.8 L 0,1.6 Z" fill="#396b73"/>
    </marker>
    <marker id="control-arrow" markerUnits="userSpaceOnUse" markerWidth="1.8" markerHeight="1.6" refX="1.8" refY="0.8" viewBox="0 0 1.8 1.6" orient="auto">
      <path d="M 0,0 L 1.8,0.8 L 0,1.6 Z" fill="#6b7b81"/>
    </marker>
    <marker id="external-arrow" markerUnits="userSpaceOnUse" markerWidth="1.8" markerHeight="1.6" refX="1.8" refY="0.8" viewBox="0 0 1.8 1.6" orient="auto">
      <path d="M 0,0 L 1.8,0.8 L 0,1.6 Z" fill="#46545b"/>
    </marker>
  </defs>

  <rect width="165" height="105" fill="#ffffff"/>

  <g id="framework">
    <rect x="2" y="38" width="161" height="65.5" rx="1.6" fill="#ffffff" stroke="#6b7b81" stroke-width="0.24"/>
    <text class="heading" x="6" y="44.5">Logical framework</text>

    <g id="engineering-thread">
      <path id="requirements-allocations" class="main" d="M 41,51 V 48.4 H 67 V 51"/>
      <path id="models-scenarios" class="main" d="M 91,51 V 48.4 H 117 V 51"/>
      <path id="run-histories" class="main" d="M 132,67 V 83"/>
      <path id="model-assessment" class="main" d="M 119,83 V 81.2 H 93 V 83"/>
      <path id="baseline-decisions" class="main" d="M 67,83 V 81.2 H 41 V 83"/>
    </g>
    <g id="controlled-context">
      <path id="current-context" class="control" d="M 14,83 V 67"/>
      <path id="release-revisions" class="control" d="M 31,83 V 73 H 122 V 67"/>
    </g>
  </g>

  <g id="external-exchanges">
    <path id="host-requests" class="external" d="M 128,51 L 75,16"/>
    <path id="host-products-results" class="external" d="M 89,16 L 136,51"/>
    <path id="whole-cubics-scenarios" class="external" d="M 128,16 L 142,51"/>
    <path id="eps-states-results" class="external" d="M 151,51 L 160,16"/>
  </g>

  <g id="external-participants" text-anchor="middle">
    <g id="f-prime">
      <rect class="block" x="55" y="2" width="46" height="14"/>
      <text class="external-name" x="78" y="7.3">F Prime</text>
      <text class="label" x="78" y="12.6">host coding/build/SIL</text>
    </g>
    <g id="omniverse">
      <rect class="block" x="109" y="2" width="54" height="14"/>
      <text class="external-name" x="136" y="7.3">NVIDIA Omniverse</text>
      <text class="label" x="136" y="12.6">whole-CUBICS simulation</text>
    </g>
  </g>

  <g id="external-exchange-labels" class="label">
    <text x="86" y="26.5" text-anchor="end">requests</text>
    <text x="117" y="30.5">products /</text>
    <text x="117" y="34">results</text>
    <text x="126" y="22.5" text-anchor="end">whole-CUBICS</text>
    <text x="126" y="26" text-anchor="end">scenarios</text>
    <text x="138" y="30.5">EPS states /</text>
    <text x="138" y="34">results</text>
  </g>

  <g id="exchange-labels" class="label">
    <text x="54" y="42" text-anchor="middle">requirements /</text>
    <text x="54" y="45.5" text-anchor="middle">allocations</text>
    <text x="104" y="42" text-anchor="middle">models /</text>
    <text x="104" y="45.5" text-anchor="middle">scenarios</text>
    <text x="136" y="75.6">run histories</text>
    <text x="106" y="79.3" text-anchor="middle">model assessment</text>
    <text x="54" y="79.3" text-anchor="middle">baseline / decisions</text>
    <text x="18" y="72.8">current</text>
    <text x="18" y="76.3">context</text>
    <text x="77" y="70.8" text-anchor="middle">release / revisions</text>
  </g>

  <g id="logical-components" text-anchor="middle">
    <g id="L01">
      <rect class="block" x="7" y="51" width="42" height="16"/>
      <text class="id" x="28" y="55.4">L01</text>
      <text class="name" x="28" y="59.9">Requirements</text>
      <text class="name" x="28" y="64">and guidance</text>
    </g>
    <g id="L02">
      <rect class="block" x="59" y="51" width="42" height="16"/>
      <text class="id" x="80" y="55.4">L02</text>
      <text class="name" x="80" y="59.9">Mission and</text>
      <text class="name" x="80" y="64">EPS design</text>
    </g>
    <g id="L03">
      <rect class="block" x="111" y="51" width="42" height="16"/>
      <text class="id" x="132" y="55.4">L03</text>
      <text class="name" x="132" y="59.9">Simulation and</text>
      <text class="name" x="132" y="64">software integration</text>
    </g>
    <g id="L06">
      <rect class="block" x="7" y="83" width="42" height="16"/>
      <text class="id" x="28" y="87.4">L06</text>
      <text class="name" x="28" y="91.9">Configuration and</text>
      <text class="name" x="28" y="96">controlled exchange</text>
    </g>
    <g id="L05">
      <rect class="block" x="59" y="83" width="42" height="16"/>
      <text class="id" x="80" y="87.4">L05</text>
      <text class="name" x="80" y="91.9">Evidence and</text>
      <text class="name" x="80" y="96">technical review</text>
    </g>
    <g id="L04">
      <rect class="block" x="111" y="83" width="42" height="16"/>
      <text class="id" x="132" y="87.4">L04</text>
      <text class="name" x="132" y="94">Model credibility</text>
    </g>
  </g>
</svg>
