<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="330pt" viewBox="0 0 690 330" role="img" aria-label="Logical architecture: component cooperation">
  <title>Logical architecture: component cooperation</title>
  <rect x="0" y="0" width="690" height="330" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <text x="8" y="20" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Logical architecture: component cooperation</text>
  <g data-system="Framework">
    <rect x="8" y="49" width="674" height="273" fill="white" stroke="#111111" stroke-width=".8" data-enclosure="Framework" />
    <text x="16" y="64" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111111">Framework</text>
    <g data-component="L01">
      <rect x="18" y="80" width="230" height="70" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="133.0" y="112.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">L01 Engineering</text>
      <text x="133.0" y="126.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">Interface</text>
    </g>
    <g data-component="L03">
      <rect x="442" y="80" width="230" height="70" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="557.0" y="112.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">L03 Simulation</text>
      <text x="557.0" y="126.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">and Analysis</text>
    </g>
    <g data-component="L06">
      <rect x="18" y="270" width="654" height="46" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="345.0" y="290.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">L06 Configuration</text>
      <text x="345.0" y="304.0" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">Management</text>
    </g>
    <g id="E01" data-exchange="engineeringAnalysisInputs" data-source="L01" data-target="L03" data-kind="information">
      <path d="M248 103 H442" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-E01" data-line-style="solid" />
      <text x="263" y="78" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Models, mission inputs</text>
      <text x="263" y="90" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; analysis requests</text>
    </g>
    <g id="E02" data-exchange="analysisResponses" data-source="L03" data-target="L01" data-kind="information">
      <path d="M442 134 H248" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="arrow-E02" data-line-style="dotted" />
      <text x="263" y="159" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Results, budgets</text>
      <text x="263" y="171" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; run histories</text>
    </g>
    <g id="E03" data-exchange="engineeringRecords" data-source="L01" data-target="L06" data-kind="information">
      <path d="M50 150 V270" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-E03" data-line-style="solid" />
      <text x="61" y="185" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Engineering records</text>
      <text x="61" y="197" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; change requests</text>
    </g>
    <g id="E04" data-exchange="analysisRecords" data-source="L03" data-target="L06" data-kind="information">
      <path d="M474 150 V270" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="7 2.5 1 2.5" id="arrow-E04" data-line-style="dashdot" />
      <text x="487" y="185" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Analysis, mapping</text>
      <text x="487" y="197" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; reconstruction records</text>
    </g>
    <g id="E05" data-exchange="engineeringContext" data-source="L06" data-target="L01" data-kind="control">
      <path d="M216 270 V150" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-E05" data-line-style="dashed" />
      <text x="61" y="235" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Current baselines</text>
      <text x="61" y="247" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; change impacts</text>
    </g>
    <g id="E06" data-exchange="controlledAnalysisInputs" data-source="L06" data-target="L03" data-kind="control">
      <path d="M640 270 V150" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-E06" data-line-style="dashed" />
      <text x="487" y="235" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">Controlled inputs</text>
      <text x="487" y="247" font-family="Times New Roman, Times, serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111111">&amp; dependencies</text>
    </g>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M441 103 H442" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E01" />
    <path d="M249 134 H248" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E02" />
    <path d="M50 269 V270" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E03" />
    <path d="M474 269 V270" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E04" />
    <path d="M216 151 V150" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E05" />
    <path d="M640 151 V150" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-E06" />
  </g>
</svg>