<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="350pt" viewBox="0 0 690 350" role="img" aria-label="CSRM EPS groups and Python property definitions">
  <title>CSRM EPS groups and Python property definitions</title>
  <rect x="0" y="0" width="690" height="350" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <text x="8" y="22" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">CSRM EPS groups and Python property definitions</text>
  <rect x="8" y="42" width="674" height="298" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="20" y="65" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Power Subsystem</text>
  <g data-card="Batteries">
    <rect x="20" y="84" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="30" y="105" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Batteries</text>
    <path d="M20 115 H230" stroke="#111111" stroke-width=".6" />
    <text x="30" y="134" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Battery</text>
    <text x="30" y="152" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Property detail: next figure</text>
  </g>
  <g data-card="Regulators and Converters">
    <rect x="240" y="84" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="250" y="105" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Regulators and Converters</text>
    <path d="M240 115 H450" stroke="#111111" stroke-width=".6" />
    <text x="250" y="134" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">RegulatorAndConverter</text>
    <text x="250" y="152" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Property detail: next figure</text>
  </g>
  <g data-card="Solar Arrays">
    <rect x="460" y="84" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="470" y="105" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Solar Arrays</text>
    <path d="M460 115 H670" stroke="#111111" stroke-width=".6" />
    <text x="470" y="134" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">SolarArray</text>
    <text x="470" y="152" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Separate full property view</text>
  </g>
  <g data-card="Power Circuits and Switches">
    <rect x="20" y="202" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="30" y="223" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Power Circuits and Switches</text>
    <path d="M20 233 H230" stroke="#111111" stroke-width=".6" />
    <text x="30" y="252" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">PowerCircuit</text>
    <text x="30" y="270" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Protection specialization</text>
  </g>
  <g data-card="Processor and Memory">
    <rect x="240" y="202" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="250" y="223" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Processor and Memory</text>
    <path d="M240 233 H450" stroke="#111111" stroke-width=".6" />
    <text x="250" y="252" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">ProcessorAndMemory</text>
    <text x="250" y="270" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Additional property view</text>
  </g>
  <g data-card="Software">
    <rect x="460" y="202" width="210" height="74" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="470" y="223" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Software</text>
    <path d="M460 233 H670" stroke="#111111" stroke-width=".6" />
    <text x="470" y="252" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Software</text>
    <text x="470" y="270" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111111">Cost only</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none" />
