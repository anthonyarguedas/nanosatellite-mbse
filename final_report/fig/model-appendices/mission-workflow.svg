<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760pt" height="844pt" viewBox="0 0 760 844" role="img" aria-label="Representative mission modeling and Git workflow">
  <title>Representative mission modeling and Git workflow</title>
  <rect x="0" y="0" width="760" height="844" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <text x="8" y="22" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Representative mission modeling and Git workflow</text>
  <g data-component="L04">
    <rect x="16" y="44" width="340" height="112" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L04" />
    <text x="28" y="66" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L04 Configuration Management</text>
    <g data-step="Open a working branch" data-requirements="FR-09" data-prepares="">
      <rect x="28" y="76" width="316" height="68" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="97" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Open a working branch</text>
      <text x="186.0" y="118" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git switch -c mission-study</text>
      <text x="186.0" y="134" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-09</text>
    </g>
  </g>
  <g data-component="L01">
    <rect x="16" y="180" width="340" height="500" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L01" />
    <text x="28" y="202" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L01 MBSE Workspace</text>
    <g data-step="Create the mission" data-requirements="FR-13" data-prepares="">
      <rect x="28" y="212" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="233" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Create the mission</text>
      <text x="186.0" y="254" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Mission(): imports and default Orbit</text>
      <text x="186.0" y="270" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Supply orbit and lifetime inputs</text>
      <text x="186.0" y="286" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-13</text>
    </g>
    <g data-step="Add CubeSat and subsystems" data-requirements="FR-01,FR-02,FR-05,FR-07,FR-08" data-prepares="">
      <rect x="28" y="320" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="341" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Add CubeSat and subsystems</text>
      <text x="186.0" y="362" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">mission.add(CubeSatBus(...))</text>
      <text x="186.0" y="378" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Run automatic additions (next figure)</text>
      <text x="186.0" y="394" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-01, FR-02, FR-05, FR-07, FR-08</text>
    </g>
    <g data-step="Tailor the mission" data-requirements="FR-01,FR-02,FR-06,FR-11,FR-13" data-prepares="">
      <rect x="28" y="428" width="316" height="100" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="449" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Tailor the mission</text>
      <text x="186.0" y="470" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Edit properties, modes and interfaces</text>
      <text x="186.0" y="486" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Revise requirements and rationale</text>
      <text x="186.0" y="502" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Request COTS matches when needed</text>
      <text x="186.0" y="518" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-01, FR-02, FR-06, FR-11, FR-13</text>
    </g>
    <g data-step="Link analysis scripts" data-requirements="FR-02,FR-03,FR-04,FR-08" data-prepares="">
      <rect x="28" y="552" width="316" height="100" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="573" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Link analysis scripts</text>
      <text x="186.0" y="594" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Mission.add_import() and Property expressions</text>
      <text x="186.0" y="610" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Bind named inputs and output fields</text>
      <text x="186.0" y="626" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Retain methods and model dependencies</text>
      <text x="186.0" y="642" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-02, FR-03, FR-04, FR-08</text>
    </g>
  </g>
  <g data-component="L02">
    <rect x="404" y="44" width="340" height="128" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L02" />
    <text x="416" y="66" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L02 COTS Database</text>
    <g data-step="Supply COTS parameters" data-requirements="FR-10" data-prepares="">
      <rect x="416" y="76" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="574.0" y="97" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Supply COTS parameters</text>
      <text x="574.0" y="118" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Select sourced component parameters</text>
      <text x="574.0" y="134" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Retain roles, conditions and units</text>
      <text x="574.0" y="150" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-10</text>
    </g>
  </g>
  <g data-component="L03">
    <rect x="404" y="202" width="340" height="128" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L03" />
    <text x="416" y="224" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L03 Simulation and Analysis</text>
    <g data-step="Execute selected EPS analyses" data-requirements="FR-12,FR-14 to FR-20" data-prepares="">
      <rect x="416" y="234" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="574.0" y="255" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Execute selected EPS analyses</text>
      <text x="574.0" y="276" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Property.value executes linked calculations</text>
      <text x="574.0" y="292" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Use stored inputs and the selected mode</text>
      <text x="574.0" y="308" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-12, FR-14 to FR-20</text>
    </g>
  </g>
  <g data-component="L01">
    <rect x="404" y="354" width="340" height="128" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L01" />
    <text x="416" y="376" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L01 MBSE Workspace</text>
    <g data-step="Verify and inspect results" data-requirements="FR-01,FR-03,FR-04,FR-06,FR-07,FR-08" data-prepares="">
      <rect x="416" y="386" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="574.0" y="407" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Verify and inspect results</text>
      <text x="574.0" y="428" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">mission.verify(mode=nominal)</text>
      <text x="574.0" y="444" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Read values, failures, missing inputs and errors</text>
      <text x="574.0" y="460" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-01, FR-03, FR-04, FR-06, FR-07, FR-08</text>
    </g>
  </g>
  <g data-actor="Engineer">
    <rect x="404" y="506" width="340" height="128" fill="#f5f5f5" stroke="#111111" stroke-width=".8" />
    <text x="416" y="528" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Engineer review</text>
    <g data-step="Review assessment coverage and assumptions" data-requirements="FR-03,FR-06" data-prepares="">
      <path d="M574 542 L720 582 L574 622 L428 582 Z" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="574" y="572" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Satisfied with</text>
      <text x="574" y="588" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">the assessment?</text>
      <text x="574" y="604" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-03, FR-06</text>
    </g>
  </g>
  <g data-component="L04">
    <rect x="16" y="704" width="728" height="128" fill="white" stroke="#111111" stroke-width=".8" data-component-boundary="L04" />
    <text x="416" y="726" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">L04 Configuration Management</text>
    <g data-step="Save and review mission Python" data-requirements="FR-04,FR-09" data-prepares="">
      <rect x="28" y="736" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="186.0" y="757" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Save and review mission Python</text>
      <text x="186.0" y="778" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Save the configuration as mission.py</text>
      <text x="186.0" y="794" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git diff -- mission.py</text>
      <text x="186.0" y="810" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-04, FR-09</text>
    </g>
    <g data-step="Commit the reviewed decision" data-requirements="FR-09" data-prepares="">
      <rect x="416" y="736" width="316" height="84" fill="white" stroke="#111111" stroke-width=".8" />
      <text x="574.0" y="757" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Commit the reviewed decision</text>
      <text x="574.0" y="778" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git add mission.py</text>
      <text x="574.0" y="794" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git commit -m "Rationale for the EPS choice"</text>
      <text x="574.0" y="810" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111" data-annotation="requirements">FR-09</text>
    </g>
  </g>
  <path d="M186 144 V212" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-1" />
  <path d="M186 296 V320" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-2" />
  <path d="M186 404 V428" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-3" />
  <path d="M186 528 V552" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-4" />
  <path d="M28 602 H6 V34 H754 V276 H732" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-5" />
  <path d="M574 318 V386" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-6" />
  <path d="M574 470 V542" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-7" />
  <path d="M428 582 H362 V510 H344" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-8" />
  <text x="374" y="568" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">No</text>
  <path d="M574 622 V686 H186 V736" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-9" />
  <text x="584" y="658" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">Yes</text>
  <path d="M344 778 H416" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-10" />
  <path d="M344 462 H374 V118 H416" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" data-exchange="COTS request" id="arrow-11" />
  <path d="M416 144 H390 V486 H344" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" data-exchange="COTS parameters" id="arrow-12" />
  <text x="370" y="348" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111111" transform="rotate(-90 370 348)">COTS request</text>
  <text x="402" y="348" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111111" transform="rotate(-90 402 348)">Parameters</text>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M186 211 V212" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-1" />
    <path d="M186 319 V320" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-2" />
    <path d="M186 427 V428" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-3" />
    <path d="M186 551 V552" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-4" />
    <path d="M733 276 H732" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-5" />
    <path d="M574 385 V386" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-6" />
    <path d="M574 541 V542" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-7" />
    <path d="M345 510 H344" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-8" />
    <path d="M186 735 V736" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-9" />
    <path d="M415 778 H416" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-10" />
    <path d="M415 118 H416" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-11" />
    <path d="M345 486 H344" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-12" />
  </g>
</svg>