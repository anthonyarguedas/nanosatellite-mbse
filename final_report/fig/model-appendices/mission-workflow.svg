<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="690pt" viewBox="0 0 690 690" role="img" aria-label="Representative mission modeling and Git workflow">
  <title>Representative mission modeling and Git workflow</title>
  <rect x="0" y="0" width="690" height="690" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <text x="8" y="22" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Representative mission modeling and Git workflow</text>
  <rect x="20" y="48" width="300" height="64" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="170.0" y="71" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Open a working branch</text>
  <text x="170.0" y="93" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git switch -c mission-study</text>
  <rect x="20" y="144" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="170.0" y="167" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Create the mission</text>
  <text x="170.0" y="189" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Mission(): imports and default Orbit</text>
  <text x="170.0" y="206" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Supply orbit and lifetime inputs</text>
  <rect x="20" y="258" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="170.0" y="281" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Add CubeSat and subsystems</text>
  <text x="170.0" y="303" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">mission.add(CubeSatBus(...))</text>
  <text x="170.0" y="320" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Run automatic additions (next figure)</text>
  <rect x="20" y="372" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="170.0" y="395" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Tailor the mission</text>
  <text x="170.0" y="417" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Edit properties, COTS, modes and interfaces</text>
  <text x="170.0" y="434" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Add or revise requirements and rationale</text>
  <rect x="20" y="486" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="170.0" y="509" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Link analysis scripts</text>
  <text x="170.0" y="531" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Mission.add_import() and Property expressions</text>
  <text x="170.0" y="548" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Bind each named input and output field</text>
  <path d="M170 112 V144" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-1" />
  <path d="M170 226 V258" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-2" />
  <path d="M170 340 V372" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-3" />
  <path d="M170 454 V486" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-4" />
  <path d="M170 568 V674 H680 V36 H515 V48" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-5" />
  <rect x="365" y="48" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="515.0" y="71" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Execute analyses and verification</text>
  <text x="515.0" y="93" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Property.value executes linked calculations</text>
  <text x="515.0" y="110" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">mission.verify(mode=nominal)</text>
  <rect x="365" y="162" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="515.0" y="185" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Inspect results and rationale</text>
  <text x="515.0" y="207" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Read values, failures, missing inputs and errors</text>
  <text x="515.0" y="224" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Check assumptions and assessment coverage</text>
  <path d="M515 130 V162" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-6" />
  <path d="M515 278 L635 324 L515 370 L395 324 Z" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="515" y="319" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Satisfied with</text>
  <text x="515" y="336" font-family="Times New Roman, Times, serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">the assessment?</text>
  <path d="M515 244 V278" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-7" />
  <path d="M395 324 H341 V413 H320" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-8" />
  <text x="350" y="313" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">No</text>
  <rect x="365" y="420" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="515.0" y="443" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Save and review mission Python</text>
  <text x="515.0" y="465" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Save the configuration as mission.py</text>
  <text x="515.0" y="482" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git diff -- mission.py</text>
  <path d="M515 370 V420" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-9" />
  <text x="525" y="397" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">Yes</text>
  <rect x="365" y="544" width="300" height="82" fill="white" stroke="#111111" stroke-width=".8" />
  <text x="515.0" y="567" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Commit the reviewed decision</text>
  <text x="515.0" y="589" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git add mission.py</text>
  <text x="515.0" y="606" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">git commit -m "Rationale for the EPS choice"</text>
  <path d="M515 502 V544" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="4 2.5" id="arrow-10" />
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M170 143 V144" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-1" />
    <path d="M170 257 V258" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-2" />
    <path d="M170 371 V372" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-3" />
    <path d="M170 485 V486" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-4" />
    <path d="M515 47 V48" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-5" />
    <path d="M515 161 V162" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-6" />
    <path d="M515 277 V278" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-7" />
    <path d="M321 413 H320" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-8" />
    <path d="M515 419 V420" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-9" />
    <path d="M515 543 V544" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-10" />
  </g>
</svg>