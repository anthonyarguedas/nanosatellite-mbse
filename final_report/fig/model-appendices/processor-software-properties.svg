<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="350pt" viewBox="0 0 690 350" role="img" aria-label="Processor, memory and software properties">
  <title>Processor, memory and software properties</title>
  <rect x="0" y="0" width="690" height="350" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <text x="8" y="22" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Processor, memory and software properties</text>
  <g data-card="Component (hardware properties)">
    <rect x="8" y="40" width="674" height="55" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="18" y="61" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Component (hardware properties)</text>
    <path d="M8 71 H682" stroke="#111111" stroke-width=".6" />
    <text x="18" y="90" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">cost [currency]    mass [kg]    volume [m3]    power [W]</text>
  </g>
  <g data-card="ProcessorAndMemory">
    <rect x="8" y="124" width="410" height="190" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="18" y="145" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">ProcessorAndMemory</text>
    <path d="M8 155 H418" stroke="#111111" stroke-width=".6" />
    <text x="18" y="174" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">supply_voltage_min [V]</text>
    <text x="18" y="193" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">supply_voltage_max [V]</text>
    <text x="18" y="212" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">clock_frequency_max [Hz]</text>
    <text x="18" y="231" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">interface_frequency_max [Hz]</text>
    <text x="18" y="250" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">program_memory_bytes [byte]</text>
    <text x="18" y="269" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">flash_memory_bytes [byte]</text>
    <text x="18" y="288" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">ram_bytes [byte]</text>
    <text x="18" y="307" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">capacity_bits [bit]</text>
  </g>
  <g data-card="Software">
    <rect x="438" y="124" width="244" height="57" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="448" y="145" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">Software</text>
    <path d="M438 155 H682" stroke="#111111" stroke-width=".6" />
    <text x="448" y="174" font-family="Times New Roman, Times, serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111111">cost [currency]</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none" />
</svg>