# Native report system-context settings (Syside 0.10.3).
[viz.layout.render_style]
interconnection = "nested"
[viz.expose]
mode = "flat"
[viz.compartments]
max_entries = 0
show_inherited_rows = false
show_annotation_rows = false
[viz.filters.interconnection]
show_node_heritage_edges = false
show_port_heritage_edges = false
show_inherited_nodes = true
show_attributes_as = "hidden"
[viz.render]
zoom_level = 3.0
max_raster_memory_mb = 512
[viz.style]
theme = "light_mono"
