<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800pt" height="324pt" viewBox="0 0 800 324" role="img" aria-label="Systems engineering technical processes">
  <title>Systems engineering technical processes</title>
  <rect x="0" y="0" width="800" height="324" fill="white" stroke="none" stroke-width=".8" />
  <defs>
    <marker id="arrow" viewBox="0 0 12 9" refX="12" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#111111" />
    </marker>
  </defs>
  <desc>Stakeholder needs inform system specification and design. System requirements feed system integration and test. Component requirements guide component design, implementation and test. Verified components feed integration, which produces the system solution. Distinct dotted and dash-dot feedback routes return from component work and integration to system design.</desc>
  <text x="8" y="22" font-family="Times New Roman, Times, serif" font-size="18" font-weight="bold" text-anchor="start" fill="#111111">Systems engineering technical processes</text>
  <g data-node="needs">
    <rect x="8" y="80" width="103" height="72" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="59.5" y="112.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Stakeholder</text>
    <text x="59.5" y="130.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">needs</text>
  </g>
  <g data-node="design">
    <rect x="141" y="72" width="174" height="88" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="228.0" y="112.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">System specification</text>
    <text x="228.0" y="130.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">and design</text>
  </g>
  <g data-node="components">
    <rect x="360" y="204" width="204" height="84" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="462.0" y="233.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Component design,</text>
    <text x="462.0" y="251.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">implementation,</text>
    <text x="462.0" y="269.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">and test</text>
  </g>
  <g data-node="integration">
    <rect x="540" y="72" width="144" height="88" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="612.0" y="112.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">System integration</text>
    <text x="612.0" y="130.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">and test</text>
  </g>
  <g data-node="solution">
    <rect x="710" y="80" width="82" height="72" fill="white" stroke="#111111" stroke-width=".8" />
    <text x="751.0" y="112.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">System</text>
    <text x="751.0" y="130.0" font-family="Times New Roman, Times, serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">solution</text>
  </g>
  <g id="process-flow-1" data-source="needs" data-target="design" data-line-style="solid">
    <path d="M111 116 H141" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-1" />
  </g>
  <g id="process-flow-2" data-source="design" data-target="integration" data-line-style="solid">
    <path d="M315 116 H540" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-2" />
    <text x="337" y="104" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">System requirements</text>
  </g>
  <g id="process-flow-3" data-source="design" data-target="components" data-line-style="solid">
    <path d="M315 144 H414 V204" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-3" />
    <text x="322" y="176" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">Component</text>
    <text x="322" y="194" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">requirements</text>
  </g>
  <g id="process-flow-4" data-source="components" data-target="integration" data-line-style="solid">
    <path d="M518 204 V144 H540" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-4" />
    <text x="428" y="176" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">Verified</text>
    <text x="428" y="194" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">components</text>
  </g>
  <g id="process-flow-5" data-source="integration" data-target="solution" data-line-style="solid">
    <path d="M684 116 H710" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" id="arrow-5" />
  </g>
  <g id="process-flow-6" data-source="components" data-target="design" data-line-style="dotted">
    <path d="M360 250 H188 V160" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="1 3" id="arrow-6" />
    <text x="216" y="241" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">Design feedback</text>
  </g>
  <g id="process-flow-7" data-source="integration" data-target="design" data-line-style="dashdot">
    <path d="M612 160 V311 H162 V160" fill="none" stroke="#111111" stroke-width="1.2" data-end-marker="url(#arrow)" data-terminal-head="true" stroke-linecap="round" stroke-dasharray="7 2.5 1 2.5" id="arrow-7" />
    <text x="624" y="254" font-family="Times New Roman, Times, serif" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">I&amp;T feedback</text>
  </g>
  <g data-layer="arrowheads" pointer-events="none">
    <path d="M140 116 H141" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-1" />
    <path d="M539 116 H540" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-2" />
    <path d="M414 203 V204" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-3" />
    <path d="M539 144 H540" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-4" />
    <path d="M709 116 H710" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-5" />
    <path d="M188 161 V160" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-6" />
    <path d="M162 161 V160" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)" data-arrow-source="arrow-7" />
  </g>
</svg>