# Native report-only presentation of bound references to existing logical parts.
[viz.layout.render_style]
general = "nested"
[viz.expose]
mode = "subtree"
[viz.compartments]
max_entries = 0
show_inherited_rows = false
show_annotation_rows = true
[viz.filters.general]
show_node_heritage_edges = false
show_port_heritage_edges = false
show_inherited_nodes = false
show_attributes_as = "hidden"
[viz.render]
zoom_level = 3.0
max_raster_memory_mb = 512
[viz.style]
theme = "light_mono"
