# Logical validation policy. The audience figure is an approved custom SVG/PDF,
# not a native Syside visualization. No render settings are passed to Syside.
[validation]
pending_native_is_failure = true
source_boundary = "seven files, excludes architecture and physical candidates"
core_boundary = "nine files, excludes verification/publication/physical candidates"
allocation = "exactly one primary owner per active FR, retired FRs excluded"
io_union = "exact final category strings with complete per-FR provenance"
negative_mutation = "native baseline passes, frozen inputs, selector matches exactly once, isolated licensed native check rejects; tooling failures never count"
safety = "native Boolean/enum truth tables, actor allocation, parameter flows, state ownership and gate dominance"
publication = "approved custom SVG/PDF identity, no native-render claim"
