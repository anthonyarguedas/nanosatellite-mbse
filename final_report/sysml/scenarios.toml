# Scoped native Syside presentation for ScenarioViews only.
# Responsibility is modeled by metadata and allocations in 09-scenarios.sysml.
# The CLI selects metaclasses, not arbitrary metadata. External calls are genuine
# PerformActionUsage instances of the named external behavior definitions.
[viz.compartments]
show_annotation_rows = false
show_inherited_rows = false
max_entries = 0

[viz.filters.action_flow]
show_node_heritage_edges = false
show_attributes_as = "hidden"
show_inherited_nodes = false

[viz.style]
theme = "light_mono"

[viz.style.group.framework]
members = ["ActionUsage"]
fill_header = "#DCEEF8"
fill_body = "#DCEEF8"
stroke = "#245A78"

[viz.style.group.external]
members = ["PerformActionUsage"]
fill_header = "#FFF0D6"
fill_body = "#FFF0D6"
stroke = "#76521B"
