<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#386254">
  <title>Mission</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23386254'/%3E%3Cpath d='M7 9h18M7 16h18M7 23h18M12 9v14M20 9v14' stroke='white' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="session-toolbar">
    <strong>Mission</strong>
    <label for="session-select">Session</label>
    <select id="session-select" disabled><option>Current</option></select>
    <button id="session-new" disabled>New</button>
    <button id="session-copy" disabled>Save as…</button>
    <button id="export-python" disabled>Download Python</button>
    <button id="refresh" disabled>Reopen</button>
    <span id="storage" class="hint"></span>
  </header>
  <main id="workspace" class="workspace" inert>
    <header class="workspace-heading">
      <div id="breadcrumbs" aria-label="Model location"></div>
      <div class="evaluation-control"><label for="evaluation-mode">Evaluate in</label><select id="evaluation-mode"><option value="">Default</option></select><span id="mission-result"></span></div>
    </header>
    <div class="left-column">
    <section class="sheet elements" aria-labelledby="elements-title">
      <div class="table-top"><h1 id="elements-title">Elements</h1><button id="context-edit" class="icon-button" aria-label="Edit current object"></button><button data-add="elements" class="add-row" aria-label="Add element">+</button></div>
      <div class="table-frame"><table aria-label="Elements"><colgroup><col class="actions-col"><col><col class="type-col"><col class="verified-col"></colgroup><thead><tr><th aria-label="Actions"></th><th>Name</th><th>Type</th><th>Verified</th></tr></thead><tbody id="element-rows"></tbody></table></div>
    </section>
    <section class="sheet modes" aria-labelledby="modes-title">
      <div class="table-top"><h2 id="modes-title">Modes and states</h2><button data-add="modes" class="add-row" aria-label="Add mode, state or allocation">+</button></div>
      <div class="table-frame"><table aria-label="Modes and states"><colgroup><col class="actions-col"><col><col class="mode-type-col"><col></colgroup><thead><tr><th aria-label="Actions"></th><th>Name / owner</th><th>Type</th><th>Values</th></tr></thead><tbody id="mode-rows"></tbody></table></div>
    </section>
    </div>
    <section class="sheet requirements" aria-labelledby="requirements-title">
      <div class="table-top"><h2 id="requirements-title">Requirements</h2><button data-add="requirements" class="add-row" aria-label="Add requirement">+</button></div>
      <div class="table-frame"><table aria-label="Requirements"><colgroup><col class="actions-col"><col class="requirement-name-col"><col><col class="verified-col"></colgroup><thead><tr><th aria-label="Actions"></th><th>Name</th><th>Requirement</th><th>Verified</th></tr></thead><tbody id="requirement-rows"></tbody></table></div>
    </section>
  </main>
  <nav id="tabs" class="sheet-tabs" role="tablist" aria-label="Model tables"></nav>
  <aside id="object-editor" aria-labelledby="editor-title" hidden></aside>
  <dialog id="add-dialog">
    <form id="add-form">
      <header class="dialog-heading"><h2 id="add-title">Add object</h2><button type="button" data-close aria-label="Close">×</button></header>
      <label for="add-owner">Owner</label><select id="add-owner"></select>
      <label for="add-type">Type</label><select id="add-type"></select>
      <div id="add-target-field" hidden><label for="add-target">Target</label><select id="add-target"></select></div>
      <label for="add-name">Name</label><input id="add-name" autocomplete="off" required>
      <p class="hint">Names are fixed Python identifiers.</p>
      <p id="add-error" class="error-text" role="alert"></p>
      <footer><button type="button" data-close>Cancel</button><button type="submit" class="primary">Add</button></footer>
    </form>
  </dialog>
  <dialog id="session-dialog">
    <form id="session-form">
      <header class="dialog-heading"><h2 id="session-title">New session</h2><button type="button" data-close aria-label="Close">×</button></header>
      <label for="session-name">Name</label><input id="session-name" maxlength="80" autocomplete="off" required>
      <p id="session-error" class="error-text" role="alert"></p>
      <footer><button type="button" data-close>Cancel</button><button type="submit" class="primary">Create</button></footer>
    </form>
  </dialog>
  <div class="notice" role="status" aria-live="polite"><span id="status">Opening mission…</span><button id="retry" hidden>Retry</button></div>
</body>
</html>
