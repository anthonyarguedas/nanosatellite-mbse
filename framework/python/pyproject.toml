[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosat-mbse"
version = "0.1.0"
description = "Python domain model for nanosatellite requirements and verification"
requires-python = ">=3.8"

[project.scripts]
nanosat-mbse = "nanosat_mbse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
